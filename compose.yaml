services:
  app:
    build: .
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DB_HOST=db
      - DB_USER=ship_user
      - DB_PASSWORD=ship_password
      - DB_NAME=ship_catalog
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ship_catalog
      MYSQL_USER: ship_user
      MYSQL_PASSWORD: ship_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
